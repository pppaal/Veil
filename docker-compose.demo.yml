# Single-command stack for the VEIL web demo:
#
#   docker compose -f docker-compose.demo.yml up
#
# Brings up:
#   - postgres        (with healthcheck)
#   - redis           (with healthcheck)
#   - minio           (with veil-encrypted bucket auto-created by minio-init)
#   - api             (NestJS, served at http://<host>:3000)
#
# The web demo is then reachable at:
#   - http://localhost:3000/demo/   on the same machine
#   - http://<host-LAN-IP>:3000/demo/   from a phone on the same Wi-Fi
#
# See docs/phone-access.md for the phone-side setup.
#
# This stack uses dev-mode defaults (placeholder JWT secret, dev MinIO admin,
# Postgres on localhost). Do NOT expose it to the public internet — for a
# private beta with invited testers use infra/docker/docker-compose.alpha.yml
# plus a real env file (apps/api/.env.alpha.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - veil_demo_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - veil_demo_redis:/data

  minio:
    # MinIO removed its images from Docker Hub (minio/minio and minio/mc now
    # return 404), so the stack uses Bitnami's frozen legacy builds of the same
    # server and client, pinned. They run as uid 1001 and keep data under
    # /bitnami/minio/data; a volume written by the old root image needs
    # `chown -R 1001:0` once before upgrading.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    command: /opt/bitnami/minio/bin/minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - veil_demo_minio:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc alias set veil http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      /opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc mb --ignore-existing veil/veil-encrypted;
      /opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc anonymous set none veil/veil-encrypted;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      # All interfaces by default so a phone on the same Wi-Fi can reach the
      # demo. The tunnel profile must set VEIL_API_BIND_ADDRESS=127.0.0.1: with
      # cf-connecting-ip, anyone who reaches this port directly picks their
      # own rate-limit bucket by sending the header.
      - "${VEIL_API_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      VEIL_ENV: development
      VEIL_API_PORT: "3000"
      VEIL_DATABASE_URL: postgresql://veil:veil@postgres:5432/veil
      VEIL_REDIS_URL: redis://redis:6379
      # When you front the demo with a public hostname (Cloudflare Tunnel,
      # nginx, etc.), set VEIL_ALLOWED_ORIGINS to that exact origin so the
      # CORS gate stops accepting wildcards. Default '*' keeps the local
      # phone-on-the-same-Wi-Fi flow working.
      VEIL_ALLOWED_ORIGINS: ${VEIL_ALLOWED_ORIGINS:-*}
      # Where the rate limiter reads the client address. `socket` for the bare
      # local stack. The tunnel profile below reaches the API through
      # cloudflared, so every request arrives from the same container address:
      # run it with VEIL_CLIENT_IP_SOURCE=cf-connecting-ip
      # (see "Client IP source" in docs/production-deployment.md).
      VEIL_CLIENT_IP_SOURCE: ${VEIL_CLIENT_IP_SOURCE:-socket}
      VEIL_ENABLE_SWAGGER: ${VEIL_ENABLE_SWAGGER:-true}
      VEIL_S3_ENDPOINT: http://minio:9000
      # Public endpoint is what the browser/phone hits for presigned PUTs.
      # Override at run time if the docker host isn't `localhost` from the
      # phone's perspective — e.g. http://192.168.1.42:9000 or, for a
      # public deploy with a separate s3 hostname, https://s3.veil.example.com.
      VEIL_S3_PUBLIC_ENDPOINT: ${VEIL_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      VEIL_S3_REGION: us-east-1
      VEIL_S3_ACCESS_KEY: minioadmin
      VEIL_S3_SECRET_KEY: minioadmin
      VEIL_S3_BUCKET: veil-encrypted
      # Generate a fresh secret for any deploy beyond local: openssl rand -base64 32.
      # The placeholder default is rejected by beta-deploy-preflight.
      VEIL_JWT_SECRET: ${VEIL_JWT_SECRET:-demo-jwt-secret-replace-with-32-byte-openssl-rand-output}
      VEIL_JWT_AUDIENCE: veil-mobile
      VEIL_JWT_ISSUER: veil-api
      VEIL_PUSH_PROVIDER: none
      VEIL_PUSH_ENABLE_DELIVERY: "false"
      VEIL_LOG_LEVEL: info
    # Migrations are now consolidated, so plain migrate deploy works on a
    # fresh database. The demo entrypoint already does this, so we just
    # delegate to it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # Optional Cloudflare Tunnel sidecar. Start with:
  #   VEIL_CLIENT_IP_SOURCE=cf-connecting-ip \
  #   VEIL_API_BIND_ADDRESS=127.0.0.1 \
  #   CLOUDFLARE_TUNNEL_TOKEN=<token-from-zerotrust-dashboard> \
  #     docker compose -f docker-compose.demo.yml --profile tunnel up -d
  # The tunnel profile MUST use cf-connecting-ip: behind cloudflared every
  # request comes from one container address, so `socket` would put all
  # tunnel users in a single rate-limit bucket. cloudflared reaches the API
  # over the compose network, so the loopback-only host port does not affect it.
  # In the Cloudflare Zero Trust dashboard set the public hostname's
  # `Service` to `http://api:3000`. See docs/cloudflare-tunnel-deploy.md.
  cloudflared:
    # Pinned to a tagged release rather than :latest so a 03:00 image rebuild
    # can't break a live tunnel. Bump deliberately when verifying a new
    # version with `docker compose -f docker-compose.demo.yml --profile tunnel pull`.
    image: cloudflare/cloudflared:2024.12.2
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  veil_demo_postgres:
  veil_demo_redis:
  veil_demo_minio:

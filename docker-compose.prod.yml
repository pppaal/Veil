# Production-grade VEIL stack for a single VPS deploy. Differences from
# docker-compose.demo.yml:
#
#   - All credentials read from .env.prod (never committed). The demo
#     compose hard-codes minioadmin and a placeholder JWT secret.
#   - Caddy front-end terminates TLS via Let's Encrypt (or stays HTTP for
#     a Cloudflare-Tunnel-only deploy — see CADDY_PUBLIC_HOSTNAME below).
#   - Prometheus + Grafana sidecars scrape the API's gated /metrics
#     endpoint and ship a pre-provisioned dashboard.
#   - Resource limits on every service so a container OOM doesn't take
#     out the host.
#   - restart=always (not unless-stopped) so a host reboot brings the
#     stack back up cleanly.
#
# Bring-up:
#   cp .env.prod.example .env.prod   # then edit
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# See docs/vps-deploy-runbook.md for the full procedure.

# Every container's log is capped (json-file, 3 x 10 MB) instead of growing
# until the container is removed. See docs/observability-hygiene.md.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    restart: always
    # terse drops DETAIL, HINT, CONTEXT and QUERY from every logged error. At
    # the default verbosity a unique violation logs the conflicting key: two
    # createDirect calls racing for one pair log both user ids (direct_key),
    # a racing registration the handle. The log would keep them past account
    # deletion. Statements are logged with $n placeholders only.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veil}
      POSTGRES_USER: ${POSTGRES_USER:-veil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }
    volumes:
      - veil_prod_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    logging: *logging
    restart: always
    # No append-only file. An AOF keeps every write, with its absolute expiry
    # time, until a rewrite (by default not before 64 MB), so keys that expire
    # after minutes (rate-limit counters keyed by client IP, prekey-claim
    # budgets, group key distributions) would stay readable on disk for weeks.
    # An RDB snapshot holds only the keys alive when it is taken, and the next
    # write replaces it within a minute. Snapshots are still needed: refresh
    # tokens live only here, Redis saves on shutdown, and the mobile app does
    # not yet fall back to a fresh device-key challenge when its refresh token
    # is gone. See docs/metadata-retention.md.
    command: ["redis-server", "--appendonly", "no", "--save", "60 1", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    volumes:
      - veil_prod_redis:/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    logging: *logging
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    expose:
      - "9000"
      - "9001"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    volumes:
      - veil_prod_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    logging: *logging
    depends_on:
      minio: { condition: service_started }
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set veil http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do sleep 1; done;
      /usr/bin/mc mb --ignore-existing veil/${MINIO_BUCKET:-veil-encrypted};
      /usr/bin/mc anonymous set none veil/${MINIO_BUCKET:-veil-encrypted};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    logging: *logging
    restart: always
    expose:
      - "3000"
    environment:
      VEIL_ENV: production
      VEIL_API_PORT: "3000"
      VEIL_DATABASE_URL: postgresql://${POSTGRES_USER:-veil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veil}
      VEIL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VEIL_ALLOWED_ORIGINS: ${VEIL_ALLOWED_ORIGINS:?VEIL_ALLOWED_ORIGINS required}
      # Caddy is the only hop in front of the API and overwrites
      # X-Forwarded-For with the real peer (infra/caddy/Caddyfile).
      VEIL_CLIENT_IP_SOURCE: x-forwarded-for
      VEIL_TRUSTED_PROXY_HOPS: "1"
      VEIL_ENABLE_SWAGGER: "false"
      VEIL_S3_ENDPOINT: http://minio:9000
      VEIL_S3_PUBLIC_ENDPOINT: ${VEIL_S3_PUBLIC_ENDPOINT:?VEIL_S3_PUBLIC_ENDPOINT required}
      VEIL_S3_REGION: ${VEIL_S3_REGION:-us-east-1}
      VEIL_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      VEIL_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      VEIL_S3_BUCKET: ${MINIO_BUCKET:-veil-encrypted}
      VEIL_JWT_SECRET: ${VEIL_JWT_SECRET:?VEIL_JWT_SECRET required (openssl rand -base64 32)}
      # Keys the HMAC that quarantines deleted handles; production refuses to
      # boot without it. The :? guard makes compose refuse to start anything
      # when it is missing, so a forgotten pepper is caught before the
      # entrypoint runs `prisma migrate deploy`.
      VEIL_RETIRED_HANDLE_PEPPER: ${VEIL_RETIRED_HANDLE_PEPPER:?VEIL_RETIRED_HANDLE_PEPPER required (openssl rand -base64 32)}
      VEIL_JWT_AUDIENCE: ${VEIL_JWT_AUDIENCE:-veil-mobile}
      VEIL_JWT_ISSUER: ${VEIL_JWT_ISSUER:-veil-api}
      VEIL_PUSH_PROVIDER: ${VEIL_PUSH_PROVIDER:-none}
      VEIL_PUSH_ENABLE_DELIVERY: ${VEIL_PUSH_ENABLE_DELIVERY:-false}
      # Required by the API when VEIL_PUSH_PROVIDER=unifiedpush.
      VEIL_UNIFIEDPUSH_ALLOWED_HOSTS: ${VEIL_UNIFIEDPUSH_ALLOWED_HOSTS:-}
      VEIL_LOG_LEVEL: ${VEIL_LOG_LEVEL:-info}
      # Production gate. Refuses to boot unless this is true AND the audit
      # report hash below is set. Set ONLY after the external crypto audit
      # clears the LibCryptoAdapter and the remediation tracker is empty.
      VEIL_AUDITED_CRYPTO_ATTESTED: ${VEIL_AUDITED_CRYPTO_ATTESTED:?must be set explicitly to true after audit}
      VEIL_AUDIT_REPORT_SHA256: ${VEIL_AUDIT_REPORT_SHA256:-}
      VEIL_METRICS_AUTH_TOKEN: ${VEIL_METRICS_AUTH_TOKEN:?VEIL_METRICS_AUTH_TOKEN required (openssl rand -hex 24)}
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1024M }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      minio-init: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_PUBLIC_HOSTNAME: ${CADDY_PUBLIC_HOSTNAME:?CADDY_PUBLIC_HOSTNAME required (or remove caddy and use cloudflared)}
      CADDY_S3_HOSTNAME: ${CADDY_S3_HOSTNAME:?CADDY_S3_HOSTNAME required}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - veil_prod_caddy_data:/data
      - veil_prod_caddy_config:/config
    depends_on:
      # Wait for the API container's HEALTHCHECK (defined in apps/api/Dockerfile)
      # to pass, not just for the container to start. Otherwise Caddy can begin
      # routing while the API is still running `prisma migrate deploy`, returning
      # 502s during the startup window.
      api: { condition: service_healthy }

  # No database dump runs. A dump would keep deleted accounts, burned one-time
  # links, expired and view-once ciphertext, receipts and the social graph
  # past every window docs/metadata-retention.md publishes, on this host and
  # wherever it is copied. Losing the Postgres volume means every user
  # registers again, which is what no recovery means anyway. See
  # docs/vps-deploy-runbook.md section 6 (and the pre-upgrade dump in 8.1,
  # which is deleted as soon as the upgrade is verified).

  prometheus:
    image: prom/prometheus:v2.55.1
    logging: *logging
    restart: always
    profiles: [observability]
    expose:
      - "9090"
    environment:
      VEIL_METRICS_AUTH_TOKEN: ${VEIL_METRICS_AUTH_TOKEN}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - veil_prod_prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:11.4.0
    logging: *logging
    restart: always
    profiles: [observability]
    expose:
      - "3001"
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - veil_prod_grafana:/var/lib/grafana
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    depends_on:
      - prometheus

volumes:
  veil_prod_postgres:
  veil_prod_redis:
  veil_prod_minio:
  veil_prod_caddy_data:
  veil_prod_caddy_config:
  veil_prod_prometheus:
  veil_prod_grafana:

      - test: apps/api/src/modules/safety/safety.service.spec.ts
        name: "is false with no mute, true with no end or an end ahead, false once it ended"
  - id: message-requests
    text: "A chat someone else starts waits on the phone as a message request, unless the phone already trusts everyone in it (verified, saved under a nickname before the chat appeared, or for a group each member verified, saved or known), until the user accepts it, sends a text or file in it or verifies the other side. Until then the phone sends no read receipt, typing indicator or reaction there, fetches no photo or file by itself, and once the first chat list has loaded sends no screenshot notice or timer change; its Chats row and notification say only \"Message request\", and Block, Report and Accept (Leave and Accept in a group) take the text field's place. Accepting sends the read receipt held back for what was read. Every chat listed at the first run after install, upgrade or a move is accepted. The server is told nothing, so the delivered tick still shows for the sender."
    sources:
      - file: README.md
        quote: "Message requests and scam warnings, worked out on the phone by fixed rules that send nothing: not the text they read, their result or a link."
      - file: README.md
        quote: "A chat from an account you haven't talked to waits as a message request: until you accept it, the phone sends no read receipt or typing indicator and downloads no photo or file by itself."
      - file: store/play/full-en.txt
        quote: "Chats from accounts you haven't talked to wait as requests."
      - file: store/appstore/metadata-en.txt
        quote: "Chats from accounts you haven't talked to wait as requests."
      - file: docs/launch/play-store-listing.md
        quote: "Chats from accounts you haven't talked to wait as requests."
      - file: docs/launch/app-store-listing.md
        quote: "Chats from accounts you haven't talked to wait as requests."
      - file: docs/app-store-listing-metadata.md
        quote: "Chats from accounts you haven't talked to wait as requests."
      - file: store/appstore/app-review-notes.md
        quote: 'On B, the chat from A waits as a message request: Chats shows "Message request" in place of the text, and the chat shows Block, Report and Accept where the text field would be.'
      - file: store/appstore/app-review-notes.md
        quote: "On B the group waits as a request too, with Leave and Accept, unless B has verified A; tap Accept."
    evidence:
      - test: apps/mobile/test/safety/contact_trust_test.dart
        name: "chats on the phone before the update are accepted, a new stranger's chat is a request"
      - test: apps/mobile/test/safety/contact_trust_test.dart
        name: "starting a chat, creating a group, verifying or sending a message accepts it for good"
      - test: apps/mobile/test/safety/contact_trust_test.dart
        name: "a screenshot notice, a reaction or a nickname saved later does not accept a request"
      - test: apps/mobile/test/safety/message_request_relay_test.dart
        name: "a stranger's first message waits as a request: no read receipt, no typing, no photo fetch until accepted"
      - test: apps/mobile/test/safety/message_request_relay_test.dart
        name: "accepting a request sends the read receipt for what was read"
      - test: apps/mobile/test/safety/message_request_relay_test.dart
        name: "a report from a request carries the same fields as any report"
      - test: apps/mobile/test/safety/app_notification_filter_test.dart
        name: "a notification for a request says Message request and quotes nothing"
      - test: apps/mobile/test/phone/message_request_phone_test.dart
        name: "a request shows Block, Report and Accept in place of the composer"
      - test: apps/mobile/test/phone/message_request_phone_test.dart
        name: "a group request offers Leave and Accept"
      - test: apps/mobile/test/phone/message_request_phone_test.dart
        name: "a screenshot or a long press in a request sends nothing and the timer is not offered"
      - test: apps/mobile/test/phone/message_request_phone_test.dart
        name: "a reaction chip in a request sends nothing, and reactions come back after Accept"
      - test: apps/mobile/test/conversations/request_row_test.dart
        name: "a request row quotes no text, has a grey badge and is left out of the Chats count"
      - test: apps/mobile/test/phone/start_conversation_phone_test.dart
        name: "a chat you start is never a request, and a stranger's chat is one"
      - test: apps/mobile/test/integration/hostile_relay_test.dart
        name: "a frame the relay labels as mine does not accept a stranger's chat"
  - id: on-device-scam-warnings
    text: "Scam warnings are fixed rules that run on the phone, not a model and not a server: a line under someone else's message names one reason (a family or new-phone claim, a money, gift card, code or ID ask, a remote-control app, an app file, a hidden or look-alike link, a fake delivery, bank, police, government or investment message), and a file named .apk, .xapk or .apks gets the app-file line from any sender and asks before it opens or saves. The checker imports nothing that can reach the network, and neither the text, the result nor the matched words go anywhere; a report from a message request carries the same fields as any report and none of the message's text. Rules can be dodged, so a message with no warning can still be a scam."
    sources:
      - file: README.md
        quote: "Message requests and scam warnings, worked out on the phone by fixed rules that send nothing: not the text they read, their result or a link."
      - file: README.md
        quote: "A line under a message flags what common scams look like: someone saying they are family or on a new phone, asks for money, gift cards, codes or ID, remote-control apps and app files, hidden or look-alike links, and fake delivery, bank, police, government and investment messages."
      - file: README.md
        quote: "A message with no warning can still be a scam."
      - file: store/play/full-en.txt
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: store/appstore/metadata-en.txt
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/launch/play-store-listing.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/launch/app-store-listing.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/app-store-listing-metadata.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
    evidence:
      - test: apps/mobile/test/safety/risk/risk_corpus_test.dart
        name: "every scam message in the corpus is flagged at its level and no normal message is flagged"
      - test: apps/mobile/test/safety/risk/risk_corpus_test.dart
        name: "the holdout set is caught at warn or higher and its normal chat is not"
      - test: apps/mobile/test/safety/risk/risk_checker_imports_test.dart
        name: "the checker imports nothing that can reach the network"
      - gate: scripts/crypto-architecture-check.mjs
      - test: apps/mobile/test/safety/message_safety_test.dart
        name: "a flagged message gets one line with one reason, and a verified sender's at most a mild one"
      - test: apps/mobile/test/chat/message_risk_line_test.dart
        name: "the risk line sits under the bubble in the tone of its level"
      - test: apps/mobile/test/chat/app_file_test.dart
        name: "an app file gets the app-file line from any sender, and opening or saving it asks first"
      - test: apps/mobile/test/safety/message_request_relay_test.dart
        name: "a report from a request carries the same fields as any report"
      - test: apps/mobile/test/l10n/no_ai_words_test.dart
        name: "no string calls the checks AI"
  - id: lookalike-warning
    text: "In a 1:1, or a group with one other member, whose other account is not verified, the phone compares that handle with every verified contact and every contact saved under a nickname for at least a week (or since before this version), and shows a warning that cannot be dismissed when it is a look-alike: a swapped or look-alike character, a suffix such as _new, the same nickname, or a handle like mom_new when a contact is saved as Mum. A new account the user did not start the chat with, or one whose safety number changed, that says it is family or on a new phone gets a banner that says to call the number the user already has. Saving a nickname or waiting does not end either banner; verifying does. Groups with more members get neither."
    sources:
      - file: README.md
        quote: "In a 1:1 or a group of two, a banner warns when the other handle looks like a saved or verified contact's, or when a new account says it is family."
      - file: store/play/full-en.txt
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: store/appstore/metadata-en.txt
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/launch/play-store-listing.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/launch/app-store-listing.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
      - file: docs/app-store-listing-metadata.md
        quote: "Warns about common scam messages and look-alike accounts, with checks on your phone."
    evidence:
      - test: apps/mobile/test/safety/risk/handle_lookalike_test.dart
        name: "flags handles one edit, a swapped look-alike character or a suffix away from a contact's"
      - test: apps/mobile/test/phone/trust_banners_phone_test.dart
        name: "a lookalike of a verified contact shows the warning and keeps it after Accept"
      - test: apps/mobile/test/phone/trust_banners_phone_test.dart
        name: "a new account that says it's family shows the claim banner, and Verify opens the safety number page"
      - test: apps/mobile/test/phone/trust_banners_phone_test.dart
        name: "saving a nickname or waiting a week does not end the claim or lookalike banner; verifying does"
      - test: apps/mobile/test/phone/trust_banners_phone_test.dart
        name: "a chat I started from a handle shows no claim banner for family words"
      - test: apps/mobile/test/phone/trust_banners_phone_test.dart
        name: "a two-person group gets the claim and lookalike checks"
      - test: apps/mobile/test/chat/chat_trust_notice_test.dart
        name: "the checks look at the one other party of a 1:1 or a two-person group only"
  - id: link-confirm
    text: "Links in messages open only after a sheet that shows the real domain and the exact address the phone will open, unless the message is the user's own or from a verified contact in an accepted chat and the link looks ordinary; a link to an app file, a short link, an IP address or other hidden host (an escape, a non-Latin letter or punycode in it included), or a domain that imitates a known site gets a stronger sheet from anyone. A company's own short link (naver.me, kko.to, me2.do) gets the plain sheet, not a stronger one, unless it is also an app file, hidden or a look-alike. The phone never fetches, previews or expands a link; it hands the exact address to another app (url_launcher, http and https only) once Open is tapped."
    sources:
      - file: README.md
        quote: "A link asks before it opens unless it is your own or from a verified contact, and an app-file, hidden or look-alike link always asks."
    evidence:
      - test: apps/mobile/test/chat/link_confirm_test.dart
        name: "a link from an unverified sender asks first and shows its domain"
      - test: apps/mobile/test/chat/link_confirm_test.dart
        name: "an app-file link gets the strong sheet even from a verified contact"
      - test: apps/mobile/test/chat/link_confirm_test.dart
        name: "the phone opens nothing and fetches nothing until Open is tapped, then opens that exact link once"
      - test: apps/mobile/test/safety/risk/link_rules_test.dart
        name: "app files, short links and look-alike domains are risky; everyday domains are not"
      - test: apps/mobile/test/safety/risk/link_rules_test.dart
        name: "a host is read the way a browser reads it, and any escape or non-Latin letter in it hides the link"
      - test: apps/mobile/test/chat/link_confirm_test.dart
        name: "a host written to look like another gets the strong sheet with the domain a browser would open"

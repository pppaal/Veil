  - id: message-retention-cap
    text: "Message ciphertext is stored until it expires, at most 30 days after the server received it, delivered or not."
    sources:
      - file: docs/privacy-policy-en.md
        quote: "Message payloads are stored encrypted until they expire, at most 30 days after the server received them, and sooner when a disappearing-message timer or view-once applies."
      - file: docs/privacy-policy-ko.md
        quote: "메시지 페이로드: 만료될 때까지 암호화된 상태로 보관하며, 서버 수신 후 최대 30일입니다."
      - file: site/index.html
        quote: "메시지 페이로드: 만료될 때까지 암호화된 상태로 보관하며, 서버 수신 후 최대 30일입니다."
      - file: site/index.html
        quote: "Message payloads are stored encrypted until they expire, at most 30 days after the server received them, and sooner when a disappearing-message timer or view-once applies."
      - file: store/play/full-en.txt
        quote: "Messages are encrypted on your device and stored on the server only as ciphertext until they expire, at most 30 days."
      - file: store/play/full-ko.txt
        quote: "메시지는 기기에서 암호화되며, 서버에는 만료될 때까지(최대 30일) 암호문으로만 보관됩니다."
    evidence:
      - test: apps/api/test/unit/retention.service.spec.ts
        name: "31-day-old message deleted regardless of expiresAt"
      - test: apps/api/test/unit/retention.service.spec.ts

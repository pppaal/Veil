  - id: one-device-at-a-time
    text: "An account is active on one device at a time: a device transfer, approved on the old device, moves the handle to keys created on the new device, revokes the old device in the same transaction, and moves no message history."
    sources:
      - file: store/play/full-en.txt
        quote: "VEIL runs on one device at a time: the built-in device transfer moves your handle to a new phone and signs the old one out, and your message history is not transferred."
      - file: store/play/full-ko.txt
        quote: "VEIL은 한 번에 한 기기에서만 쓸 수 있습니다."
      - file: store/play/full-ko.txt
        quote: "앱 내 기기 이전은 핸들을 새 기기로 옮기고 이전 기기를 로그아웃시키며, 대화 기록은 옮겨지지 않습니다."
      - file: store/appstore/screenshot-spec.md
        quote: "4 | Encrypted device transfer | Device transfer — the old device must be present and approve; the handle moves to keys generated on the new phone, the old phone is signed out, and message history does not move. | \"Move your handle to a new phone. The old one signs out.\" | \"핸들을 새 기기로 옮기고, 이전 기기는 로그아웃됩니다.\""
    evidence:
      - test: apps/api/src/modules/device-transfer/device-transfer.service.spec.ts
        name: "requires the old trusted device, adds the new one, and revokes the old device atomically"
  - id: handle-quarantine
    text: "A deleted account's handle cannot be registered again for 90 days, and the server keeps only a keyed hash of it."
    sources:
      - file: docs/privacy-policy-en.md
        quote: "To stop someone else from registering the same handle and being mistaken for you, a keyed hash of the handle (not the handle itself) is kept for 90 days."
      - file: docs/privacy-policy-ko.md
        quote: "다른 사람이 같은 핸들을 등록해 이용자로 오인되지 않도록, 핸들 자체가 아닌 핸들의 키 해시만 90일간 보관합니다."
      - file: site/index.html
        quote: "다른 사람이 같은 핸들을 등록해 이용자로 오인되지 않도록, 핸들 자체가 아닌 핸들의 키 해시만 90일간 보관합니다."
      - file: site/index.html
        quote: "To stop someone else from registering the same handle and being mistaken for you, a keyed hash of the handle (not the handle itself) is kept for 90 days."
    evidence:
      - test: apps/api/src/modules/auth/auth.service.spec.ts
        name: "quarantined handle register 409"
      - test: apps/api/src/modules/account/account.service.spec.ts
        name: "quarantines the handle for 90 days in the transaction that deletes the user"
  - id: wake-only-push
    text: "Push notifications only wake the app: they carry no message content, no envelope fields and no conversation metadata, and reactions send none at all."
    sources:
      - file: README.md
        quote: "Push payloads carry no plaintext or envelope fields"
    evidence:
      - gate: scripts/policy-check.mjs
      - test: apps/api/test/unit/push.service.spec.ts
        name: "builds opaque wake-only APNs requests with no conversation metadata"
      - test: apps/api/test/unit/push.service.spec.ts
        name: "builds opaque wake-only FCM requests with no conversation metadata"
      - test: apps/api/test/unit/unifiedpush-push.provider.spec.ts
        name: "builds an opaque, wake-only request to the device endpoint"
      - test: apps/api/src/modules/messages/messages.service.spec.ts
        name: "reaction envelope accepted and no push sent"
  - id: crypto-primitives
    text: "The message crypto is built on X25519, Ed25519, HKDF-SHA256 and AES-256-GCM, pinned in CI by known-answer vectors."
    sources:
      - file: docs/privacy-policy-en.md
        quote: "End-to-end encryption: X25519 + AES-256-GCM + Ed25519 + HKDF-SHA256."
      - file: docs/privacy-policy-ko.md
        quote: "종단간 암호화: X25519 + AES-256-GCM + Ed25519 + HKDF-SHA256"
      - file: docs/security-hardening-roadmap.md
        quote: "E2E (X25519 + AES-256-GCM + Ed25519, Double Ratchet) | ✅ strong | lib_crypto_adapter.dart, crypto-envelope-spec.md"
      - file: site/index.html
        quote: "종단간 암호화: X25519 + AES-256-GCM + Ed25519 + HKDF-SHA256"
      - file: site/index.html
        quote: "End-to-end encryption: X25519 + AES-256-GCM + Ed25519 + HKDF-SHA256."
      - file: store/appstore/app-review-notes.md
        quote: "Veil implements its own end-to-end encryption (a Double Ratchet over X25519, AES-256-GCM, Ed25519, and HKDF-SHA256)."
      - file: docs/launch/app-store-listing.md
        quote: "Veil uses end-to-end encryption with only standard, published algorithms (X25519, AES-256-GCM, Ed25519, HKDF-SHA256 — see docs/crypto-envelope-spec.md)."
    evidence:
      - gate: scripts/crypto-test-vectors.mjs
  - id: message-padding
    text: "Both clients pad every message to a size bucket before AES-GCM (ISO/IEC 7816-4, 256 B up to 64 KiB, then 64 KiB steps) and every attachment to a Padmé length, so a ciphertext's size reveals only its bucket. The protocol-v2 known-answer vectors pin the padded plaintext."
    sources:
      - file: docs/security-hardening-roadmap.md
        quote: "Message-length padding | ✅ shipped (mobile and web) | every message is ISO/IEC 7816-4 padded to a size bucket before AES-GCM, attachments to a Padmé length: message_padding.dart (1:1 and Sender Keys groups), web padding.js; pinned by the protocol-v2 known-answer vectors (crypto-test-vectors.mjs, kat-v2.test.js)"
    evidence:
      - gate: scripts/crypto-test-vectors.mjs
      - test: apps/web-demo/__tests__/kat-v2.test.js
        name: "inner payload and its padding"
      - test: apps/mobile/test/message_padding_test.dart
        name: "pads to the expected bucket and always adds the delimiter"
  - id: forward-secrecy-ratchet
    text: "One-to-one sessions in the mobile app use a Double Ratchet: each message has its own key from a one-way KDF chain and the DH ratchet steps on every turn, so the session keys a device holds today cannot decrypt messages it already received. CI pins the ratchet's key schedule with known-answer vectors."
    sources:
      - file: README.md
        quote: "Forward Secrecy Ratchet Design — implemented mobile ratchet"
    evidence:
      - gate: scripts/crypto-test-vectors.mjs
  - id: sealed-sender-not-implemented
    text: "Sealed sender is not implemented, and its current design is under revision because it would not hide the sender: the server authenticates the sending device of every message."
    sources:
      - file: README.md
        quote: "Sealed sender is under revision: the current design in docs/sealed-sender-design.md does not hide the sender from the server."
      - file: README.md
        quote: "Sealed Sender Design — under revision: the current design does not hide the sender"
      - file: docs/security-hardening-roadmap.md
        quote: "Sealed sender (metadata) | 📝 under revision | sealed-sender-design.md: the current design does not hide the sender"
    evidence:
      - test: apps/api/src/modules/messages/messages.service.spec.ts
        name: "rejects when envelope senderDeviceId does not match auth device"
  - id: key-transparency-not-implemented
    text: "Key transparency is not implemented; safety numbers are compared by hand. Until it ships, deleted handles are quarantined so a re-registered handle cannot pass as its old owner."
    sources:
      - file: docs/security-hardening-roadmap.md
        quote: "Key transparency | ❌ absent | safety numbers are manual; nothing auto-detects a malicious server swapping keys. Deleted handles are quarantined for 90 days, so a re-registered handle cannot pass as its old owner right away"
      - file: docs/security-hardening-roadmap.md
        quote: "Key transparency."
      - file: docs/security-hardening-roadmap.md
        quote: "Key transparency (an append-only, publicly-verifiable log of identity-key→user bindings, CONIKS / Parakeet / Signal-KT style) lets clients *automatically* detect a server that serves a forged key, closing the last server-trust hole (active MITM via key substitution)."
      - file: docs/security-hardening-roadmap.md
        quote: "Key transparency (C) as the flagship Tier-2 spec — it's the one capability that would put VEIL's server-trust model *ahead* of most messengers."
    evidence:
      - test: apps/api/src/modules/auth/auth.service.spec.ts
        name: "quarantined handle register 409"
  - id: post-quantum-not-shipped
    text: "Post-quantum protection is specified but not shipped: the message crypto CI pins is classical (X25519, Ed25519, HKDF-SHA256, AES-256-GCM)."
    sources:
      - file: docs/security-hardening-roadmap.md
        quote: "Post-quantum | 📝 specced (#6/#7) | post-quantum-migration-spec.md"
    evidence:
      - gate: scripts/crypto-test-vectors.mjs
  - id: crypto-work-audit-gated
    text: "Protocol v2, its web port, message padding and Sender Keys shipped before any external audit; the crypto work still open waits for it, and a production server refuses to boot until an audited crypto report is attested."
    sources:
      - file: docs/security-hardening-roadmap.md
        quote: "The crypto-heavy items still open (C, D, post-quantum, sealed sender) wait for the audit; build work (A) can proceed in parallel now."
      - file: docs/tester-guide-ko.md
        quote: "종단간 암호화는 동작하지만 외부 보안 감사가 아직 안 끝났어요"
    evidence:
      - test: apps/api/test/unit/app-config.service.spec.ts
        name: "production requires VEIL_AUDIT_REPORT_SHA256"

  - id: handle-quarantine
    text: "A deleted account's handle cannot be registered again for 90 days, and the server keeps only a keyed hash of it."
    sources:
      - file: docs/privacy-policy-en.md
        quote: "To stop someone else from registering the same handle and being mistaken for you, a keyed hash of the handle (not the handle itself) is kept for 90 days."
      - file: docs/privacy-policy-ko.md
        quote: "다른 사람이 같은 핸들을 등록해 이용자로 오인되지 않도록, 핸들 자체가 아닌 핸들의 키 해시만 90일간 보관합니다."
      - file: site/index.html
        quote: "다른 사람이 같은 핸들을 등록해 이용자로 오인되지 않도록, 핸들 자체가 아닌 핸들의 키 해시만 90일간 보관합니다."
      - file: site/index.html
        quote: "To stop someone else from registering the same handle and being mistaken for you, a keyed hash of the handle (not the handle itself) is kept for 90 days."
    evidence:
      - test: apps/api/src/modules/auth/auth.service.spec.ts
        name: "quarantined handle register 409"
      - test: apps/api/src/modules/account/account.service.spec.ts
        name: "quarantines the handle for 90 days in the transaction that deletes the user"

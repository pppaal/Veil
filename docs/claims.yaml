        name: "production requires VEIL_AUDIT_REPORT_SHA256"
  - id: mobile-block-report-mute
    text: "The mobile app reports and blocks accounts and mutes chats. A report holds the reporter's account, the reported account, the reason and which chat or message, never what it says; the server refuses a 1:1 send across a block in either direction; a muted chat raises no notification on the phone, and the server is told so it wakes no device for it."
    sources:
      - file: README.md
        quote: "Block, report and mute: from a chat's menu, a message's long-press sheet, a contact's sheet and a 1:1 request's bar, with Settings > Privacy > Blocked accounts; a muted chat raises no notification on the phone"
      - file: store/play/full-en.txt
        quote: "Block or report someone, and mute a chat"
      - file: store/appstore/metadata-en.txt
        quote: "Block or report someone, and mute a chat"
      - file: docs/launch/play-store-listing.md
        quote: "Block or report someone, and mute a chat"
      - file: docs/launch/play-store-listing.md
        quote: "A chat's menu, a message's long-press sheet, a contact's sheet and the bar of a 1:1 message request file a report (POST /safety/reports): the account, the reason and which chat or message, never its text."
      - file: docs/launch/app-store-listing.md
        quote: "Block or report someone, and mute a chat"
      - file: docs/launch/app-store-listing.md
        quote: "The mobile app reports and blocks accounts from a chat, a message and a contact, as App Review expects in an app with user-generated content (guideline 1.2)."
      - file: docs/app-store-listing-metadata.md
        quote: "Answer the ITunes/Play content questionnaire truthfully (user communication, no moderation of E2E content is possible by design; the mobile app blocks and reports accounts, so say so)."
      - file: store/appstore/app-review-notes.md
        quote: "A report sends B's account, the reason and which chat or message, not what it says."
    evidence:

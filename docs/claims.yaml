# Claims-as-code ledger. Every privacy or security claim VEIL makes in public
# copy (README, privacy policies, site/, store/, the store listing drafts in
# docs/launch/ and docs/app-store-listing-metadata.md, the security roadmap,
# the Korean guides docs/사용설명서.md and docs/tester-guide-ko.md) is
# listed here with the sentences that make it and the tests or CI gates that
# back it.
# scripts/claims-check.mjs fails CI when a claim loses its evidence, a quoted
# sentence changes, or a source gains a claim sentence this ledger does not quote.
#
# Format (a YAML subset): each claim has an id, the claim in plain words, the
# exact sentences that make it ({file, quote}, as the checker normalises them),
# and evidence: {test: <file>, name: <test title>} or {gate: <script CI runs>}.
claims:
  - id: e2e-message-content
    text: "Message content is end-to-end encrypted on the sending device; the server relays and stores only ciphertext it cannot decrypt. In a group, the messages are readable by the members the devices were shown: the server decides membership, so a server that adds a member gives that member the keys for later messages, and the mobile app shows a notice in the chat whenever a member is added."

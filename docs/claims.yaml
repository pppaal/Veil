      - file: README.md
        quote: "Veil is an open-source, end-to-end encrypted messenger for phones and the web; you sign up with a handle, not a phone number or email."
      - file: docs/privacy-policy-en.md
        quote: "Veil (\"the service\") collects the absolute minimum data required to operate an end-to-end encrypted messenger."
      - file: docs/privacy-policy-en.md
        quote: "End-to-end encrypted message payloads that the server cannot decrypt."

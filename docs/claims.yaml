  - id: photo-metadata-dropped
    text: "A photo sent from the phone's Photos is re-encoded on the phone from its pixels alone, at a long edge of at most 1600 px, so its location, camera details and other metadata do not leave the phone. A file sent with File goes as it is, and the confirm dialog warns that a photo or video sent that way keeps any location saved in it."
    sources:
      - file: README.md
        quote: "Photos come from the system photo picker and are re-encoded on the phone at up to 1600 px, which drops their location and camera details; files up to 25 MB come from the system file picker and go as they are."
    evidence:
      - test: apps/mobile/test/integration/attachment_round_trip_test.dart
        name: "a photo and a file reach the other phone and the relay holds only ciphertext"

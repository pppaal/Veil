services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - veil_alpha_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - veil_alpha_redis:/data

  minio:
    # MinIO removed its images from Docker Hub (minio/minio and minio/mc now
    # return 404), so the stack uses Bitnami's frozen legacy builds of the same
    # server and client, pinned. They run as uid 1001 and keep data under
    # /bitnami/minio/data; a volume written by the old root image needs
    # `chown -R 1001:0` once before upgrading.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    command: /opt/bitnami/minio/bin/minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - veil_alpha_minio:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc alias set veil http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      /opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc mb --ignore-existing veil/veil-encrypted;
      /opt/bitnami/minio-client/bin/mc --config-dir /tmp/.mc anonymous set none veil/veil-encrypted;
      exit 0;
      "

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env.alpha.example
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  veil_alpha_postgres:
  veil_alpha_redis:
  veil_alpha_minio:

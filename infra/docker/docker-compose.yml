services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
    ports:
      - "5432:5432"
    volumes:
      - veil_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - veil_redis:/data

  minio:
    # MinIO removed its images from Docker Hub (minio/minio and minio/mc now
    # return 404), so the stack uses Bitnami's frozen legacy builds of the same
    # server and client, pinned. They run as uid 1001 and keep data under
    # /bitnami/minio/data; a volume written by the old root image needs
    # `chown -R 1001:0` once before upgrading.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    command: /opt/bitnami/minio/bin/minio server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - veil_minio:/bitnami/minio/data

volumes:
  veil_postgres:
  veil_redis:
  veil_minio:
